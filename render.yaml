services:
  - type: web
    name: radiologia-laudos-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: APP_DB_PATH
        value: /var/data/radiologia_laudos.db
